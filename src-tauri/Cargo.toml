[package]
name = "totp"
version = "0.1.0"
description = "Simple TOTP / 2FA authenticator"
authors = ["wilisssss <317244304+wilisssss@users.noreply.github.com>"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix is needed to avoid a name clash with the bin target.
name = "totp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = "0.4.45"
data-encoding = "2.11.1"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rand = "0.9"
rfd = "0.17.2"
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6.1"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "time"] }
ureq = "3.4.2"
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = { version = "1.9.0", features = ["derive", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
