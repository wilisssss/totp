name: Release

# Push a tag (e.g. v0.1.0): build the AppImage and the Arch pacman package in
# parallel, then publish a single draft release holding both files plus their
# checksums. Nothing touches the release API until both builds succeed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # No tagName on purpose: this only builds, the release job below publishes.
      - name: Build AppImage
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 1

  arch-package:
    name: Pacman package (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install checkout prerequisites
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v4

      # makepkg refuses to run as root, so build from a plain user.
      # su switches HOME to the builder, which cargo and npm both need.
      - name: Build package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/src
          chown -R builder:builder /home/builder/src
          su builder -c 'cd /home/builder/src/packaging && makepkg -s --noconfirm --cleanbuild'
          cp /home/builder/src/packaging/*.pkg.tar.zst "$GITHUB_WORKSPACE/"
          ls -la "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: pacman-package
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish draft release
    needs: [appimage, arch-package]
    runs-on: ubuntu-latest
    steps:
      - name: Collect both artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TOTP ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body: >
            Rilis otomatis: AppImage untuk Linux umum dan paket pacman
            (.pkg.tar.zst) untuk Arch Linux. Verifikasi berkas dengan
            SHA256SUMS.
          files: assets/*
